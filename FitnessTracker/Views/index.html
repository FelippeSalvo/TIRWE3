<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FitnessTracker - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>FitnessTracker</h1>
  </header>
  <div class="page">
    <div id="loggedOut">
      <div class="card login-card">
        <h1>Entrar</h1>
        <p class="error" id="msg"></p>
        <form id="formLogin">
          <label>Email <input type="email" id="email" required placeholder="seu@email.com"></label>
          <label>Senha <input type="password" id="senha" required placeholder="••••••••"></label>
          <button type="submit">Entrar</button>
        </form>
        <p style="margin-top: 1rem;"><a href="register.html">Criar conta</a></p>
      </div>
    </div>
    <div id="loggedIn" style="display:none">
      <p class="success">Você está logado.</p>
      <nav>
        <a href="exercises.html">Exercícios</a>
        <a href="treinos.html">Meus treinos</a>
        <a href="create-treino.html">Criar treino</a>
        <a href="splits.html">Templates</a>
      </nav>
      <div class="dashboard-nav">
        <a href="exercises.html">Catálogo de exercícios</a>
        <a href="treinos.html">Meus treinos</a>
        <a href="create-treino.html">Criar novo treino</a>
        <a href="splits.html">Templates de divisão</a>
      </div>
      <button type="button" id="btnLogout" class="secondary">Sair</button>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script>
    if (getToken()) {
      document.getElementById('loggedOut').style.display = 'none';
      document.getElementById('loggedIn').style.display = 'block';
    }
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.textContent = '';
      try {
        const res = await apiPost('/api/auth/login', {
          email: document.getElementById('email').value.trim(),
          senha: document.getElementById('senha').value
        });
        setToken(res.token);
        location.reload();
      } catch (err) {
        msg.textContent = err.message || 'Erro ao fazer login';
      }
    });
    document.getElementById('btnLogout').addEventListener('click', () => {
      setToken(null);
      location.reload();
    });
  </script>
</body>
</html>
