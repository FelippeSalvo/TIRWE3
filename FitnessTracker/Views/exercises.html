<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercícios - FitnessTracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>FitnessTracker</h1>
    <nav>
      <a href="index.html">Início</a>
      <a href="exercises.html">Exercícios</a>
      <a href="treinos.html">Meus treinos</a>
      <a href="create-treino.html">Criar treino</a>
      <a href="splits.html">Templates</a>
    </nav>
  </header>
  <div class="page">
    <h1>Catálogo de exercícios</h1>
    <p class="error" id="msg"></p>
    <div id="list"></div>
  </div>
  <script src="js/app.js"></script>
  <script>
    if (!checkAuth()) throw new Error();
    (async () => {
      const msg = document.getElementById('msg');
      const list = document.getElementById('list');
      try {
        const data = await apiGet('/api/exercises');
        if (!data || data.length === 0) {
          list.innerHTML = '<div class="card"><p>Nenhum exercício cadastrado.</p></div>';
          return;
        }
        list.innerHTML = '<div class="table-wrap"><table><thead><tr><th>Nome</th><th>Grupo</th><th>Tipo</th><th>Equipamento</th><th>Nível</th></tr></thead><tbody>' +
          data.map(e => `<tr>
            <td><strong>${e.nome || ''}</strong></td>
            <td>${e.grupoMuscularPrincipal || ''}</td>
            <td>${e.tipoMovimento || ''}</td>
            <td>${e.equipamento || ''}</td>
            <td>${e.nivelDificuldade || ''}</td>
          </tr>`).join('') + '</tbody></table></div>';
      } catch (err) {
        msg.textContent = err.message || 'Erro ao carregar';
      }
    })();
  </script>
</body>
</html>
