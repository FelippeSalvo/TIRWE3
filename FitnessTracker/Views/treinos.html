<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meus treinos - FitnessTracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>FitnessTracker</h1>
    <nav>
      <a href="index.html">Início</a>
      <a href="exercises.html">Exercícios</a>
      <a href="treinos.html">Meus treinos</a>
      <a href="create-treino.html">Criar treino</a>
      <a href="splits.html">Templates</a>
    </nav>
  </header>
  <div class="page">
    <h1>Meus treinos</h1>
    <p><a href="create-treino.html" class="btn">+ Criar treino</a></p>
    <p class="error" id="msg"></p>
    <div id="list"></div>
  </div>
  <script src="js/app.js"></script>
  <script>
    if (!checkAuth()) throw new Error();
    (async () => {
      const msg = document.getElementById('msg');
      const list = document.getElementById('list');
      try {
        const data = await apiGet('/api/treino');
        if (!data || data.length === 0) {
          list.innerHTML = '<div class="card"><p>Nenhum treino. <a href="create-treino.html">Criar um</a></p></div>';
          return;
        }
        list.innerHTML = data.map(t => `
          <div class="card treino-card">
            <div>
              <strong>${t.nome || ''}</strong>
              <p style="margin: 0.35rem 0 0 0; color: var(--text-muted); font-size: 0.9rem;">${t.grupoMuscularFoco || ''} · ${t.divisaoTreino || ''}</p>
            </div>
            <div class="links">
              <a href="treino-detail.html?id=${t.id}" class="btn secondary">Ver</a>
              <a href="advanced-analysis.html?id=${t.id}" class="btn">Análise</a>
            </div>
          </div>
        `).join('');
      } catch (err) {
        msg.textContent = err.message || 'Erro ao carregar';
      }
    })();
  </script>
</body>
</html>
