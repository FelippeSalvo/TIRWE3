<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Templates de divisão - FitnessTracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>FitnessTracker</h1>
    <nav>
      <a href="index.html">Início</a>
      <a href="exercises.html">Exercícios</a>
      <a href="treinos.html">Meus treinos</a>
      <a href="create-treino.html">Criar treino</a>
      <a href="splits.html">Templates</a>
    </nav>
  </header>
  <div class="page">
    <h1>Templates de divisão</h1>
    <p class="error" id="msg"></p>
    <div id="list"></div>
  </div>
  <script src="js/app.js"></script>
  <script>
    if (!checkAuth()) throw new Error();
    (async () => {
      const msg = document.getElementById('msg');
      const list = document.getElementById('list');
      try {
        const data = await apiGet('/api/splits/templates');
        if (!data || data.length === 0) {
          list.innerHTML = '<div class="card"><p>Nenhum template.</p></div>';
          return;
        }
        list.innerHTML = data.map(t => `
          <div class="card split-card">
            <div>
              <strong>${t.nome || t.divisaoTreino || ''}</strong>
              <p style="margin: 0.35rem 0 0 0; color: var(--text-muted); font-size: 0.9rem;">${t.frequenciaSemanalSugerida || 0}x por semana</p>
              <ul class="plain" style="margin: 0.5rem 0 0 0;">
                ${(t.dias || []).map(d => `<li><strong>${d.nomeDia || 'Dia ' + d.diaNumero}</strong>: ${(d.gruposMusculares || []).join(', ')}</li>`).join('')}
              </ul>
            </div>
          </div>
        `).join('');
      } catch (err) {
        msg.textContent = err.message || 'Erro ao carregar';
      }
    })();
  </script>
</body>
</html>
